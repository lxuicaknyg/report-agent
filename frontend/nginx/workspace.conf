# The workspace's single origin: the SPA plus every backend behind it.
#
# Routing is by the segment after /api. This app owns /api/report/v1/*; other
# teams' tools get their own namespace and their own container, dropped into
# /etc/nginx/workspace-modules/ as a .conf file (see the include below).

server {
    listen 80;
    server_name _;

    # Excel workbooks and .docx templates come through here. nginx's 1m default
    # rejects them with a 413 that never reaches the app, so the UI can only
    # report "上传失败" with nothing in the backend log to explain it.
    client_max_body_size 200m;

    charset utf-8;

    # Docker's embedded DNS. Needed because every proxy_pass below goes through
    # a variable, which is what defers name resolution to request time.
    #
    # nginx normally resolves upstream names once, at startup, and refuses to
    # start if one of them is unknown. In a workspace where each team deploys
    # its own backend on its own schedule, that means a tool that has not been
    # deployed yet takes down the entire gateway — including the login page and
    # every other team's tool. Resolving per request turns that into a 502 on
    # one path, which is the blast radius it should have had all along.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The gateway's own liveness, answered without touching a backend — it says
    # "nginx is up", which is what an orchestrator restarting this container
    # needs to know.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── this app's backend ────────────────────────────────────────────────
    location /api/report/v1/ {
        # Through a variable on purpose — see the resolver note above. With no
        # URI part after the port, nginx forwards the original request URI
        # unchanged, which is what the backend's API_PREFIX expects.
        set $report_backend backend;
        proxy_pass http://$report_backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Some endpoints call the LLM gateway synchronously, and the client
        # retries a slow gateway up to LLM_MAX_ATTEMPTS times. The default 60s
        # read timeout cuts those off mid-retry and surfaces as a 504 the app
        # cannot explain. Report generation itself is polled, not held open.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ── other teams' tools ────────────────────────────────────────────────
    # One file per tool, e.g.
    #
    #   location /api/their-tool/v1/ { proxy_pass http://their-backend:8000; ... }
    #
    # Mounted rather than baked in, so adding a tool does not mean rebuilding
    # and redistributing this image. See deploy/nginx-modules/.
    include /etc/nginx/workspace-modules/*.conf;

    # Anything under /api/ that no backend claimed. Without this it falls
    # through to the SPA below and answers 200 with index.html: the browser
    # then fails parsing HTML as JSON, and apiClient reports it as "无法连接
    # 后端服务" — sending whoever forgot their location block off to debug the
    # network. A 404 with a JSON body names the actual mistake.
    #
    # Prefix locations match longest-first, so every /api/<service>/v1/ block
    # above still wins; this only catches what nothing else did.
    location /api/ {
        default_type application/json;
        return 404 '{"detail":"没有后端注册在这个路径上，检查网关的 location 配置"}';
    }

    # ── the SPA ───────────────────────────────────────────────────────────
    # Hashed filenames, so they can be cached hard and forever.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        # vue-router uses history mode: /reports/abc123 is a client-side route
        # with no file behind it. Without this, reloading any page but / is a
        # 404 from nginx.
        try_files $uri $uri/ /index.html;

        # index.html must never be cached: it names the hashed bundles, so a
        # cached copy pins users to the previous release after a redeploy and
        # they have no way to recover but a hard refresh.
        add_header Cache-Control "no-store, must-revalidate";
    }
}
